<!-- Top Navigation Bar -->
<nav class="glass border-b border-white/[0.06] px-4 md:px-6 py-3">
    <div class="flex items-center justify-between gap-4">
        <!-- Left: Mobile Menu Toggle + Breadcrumb -->
        <div class="flex items-center gap-3">
            <!-- Mobile Hamburger -->
            <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg hover:bg-white/10 transition-colors duration-200" aria-label="Toggle sidebar">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <!-- Page Title / Breadcrumb -->
            <div class="hidden sm:block">
                <h2 class="text-sm font-medium text-gray-400">
                    <a href="/dashboard" class="hover:text-primary-400 transition-colors flex items-center gap-1">
                        {% block navbar_title %}Dashboard{% endblock %}
                    </a>
                </h2>
            </div>
        </div>

        <!-- Center: Search Bar -->
        <div class="flex-1 max-w-md mx-auto hidden md:block">
            <div class="relative">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input type="text"
                       id="nav-search-input"
                       placeholder="Search datasets, models, reports..."
                       class="w-full pl-10 pr-4 py-2 bg-white/[0.05] border border-white/[0.08] rounded-xl text-sm text-gray-300 placeholder-gray-500 focus:outline-none focus:border-primary-500/50 focus:bg-white/[0.08] focus:ring-1 focus:ring-primary-500/20 transition-all duration-200">
                <kbd class="absolute right-3 top-1/2 -translate-y-1/2 hidden lg:inline-block px-2 py-0.5 text-[10px] font-medium text-gray-500 bg-white/[0.06] border border-white/[0.08] rounded">⌘K</kbd>
                
                <!-- Floating Search Results Dropdown -->
                <div id="nav-search-dropdown" class="absolute left-0 right-0 top-full mt-2 glass border border-white/[0.08] rounded-xl shadow-2xl shadow-black/40 py-2 hidden z-50 max-h-60 overflow-y-auto scrollbar-thin">
                    <!-- Results will be injected by JS -->
                </div>
            </div>
        </div>

        <!-- Right: Actions -->
        <div class="flex items-center gap-2">
            <!-- Notification Bell -->
            <div class="relative" id="nav-notification-container">
                <button onclick="toggleNotificationDropdown()" id="nav-notification-btn" class="relative p-2 rounded-xl hover:bg-white/10 transition-all duration-200 group" aria-label="Notifications">
                    <svg class="w-5 h-5 text-gray-400 group-hover:text-gray-200 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                    </svg>
                    <!-- Notification Badge -->
                    <span id="nav-notification-badge" class="absolute top-1.5 right-1.5 w-2 h-2 bg-primary-500 rounded-full ring-2 ring-surface-800 hidden"></span>
                </button>

                <!-- Floating Notification Dropdown -->
                <div id="nav-notification-dropdown" class="absolute right-0 top-full mt-2 w-80 glass border border-white/[0.08] rounded-xl shadow-2xl shadow-black/40 py-2 hidden z-50 max-h-80 overflow-y-auto scrollbar-thin">
                    <div class="px-4 py-2 border-b border-white/[0.06] flex items-center justify-between">
                        <p class="text-xs font-semibold text-gray-200">Notifications</p>
                        <button onclick="clearAllNotifications()" class="text-[10px] text-primary-400 hover:text-primary-300 font-medium">Clear All</button>
                    </div>
                    <div id="nav-notifications-list" class="divide-y divide-white/[0.04]">
                        <!-- Injected by JS -->
                    </div>
                </div>
            </div>

            <!-- Theme Toggle -->
            <button onclick="toggleTheme()" id="theme-toggle-btn" class="p-2 rounded-xl hover:bg-white/10 transition-all duration-200 group" aria-label="Toggle Theme">
                <!-- Moon Icon (shows in light mode) -->
                <svg id="theme-moon-icon" class="w-5 h-5 text-gray-400 group-hover:text-gray-200 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
                <!-- Sun Icon (shows in dark mode) -->
                <svg id="theme-sun-icon" class="w-5 h-5 text-gray-400 group-hover:text-gray-200 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14 12a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
            </button>

            <!-- Divider -->
            <div class="w-px h-6 bg-white/[0.08] hidden sm:block"></div>

            <!-- User Dropdown -->
            <div class="relative" id="user-dropdown-container">
                <button onclick="toggleUserDropdown()" class="flex items-center gap-2 p-1.5 pr-3 rounded-xl hover:bg-white/10 transition-all duration-200" id="user-menu-btn">
                    <!-- Avatar -->
                    <div id="nav-avatar-letter" class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-500 to-purple-600 flex items-center justify-center text-sm font-semibold text-white shadow-lg shadow-primary-500/20">
                        {{ (user.username[0] if user and user.username else 'U') | upper }}
                    </div>
                    <span id="nav-username" class="hidden sm:block text-sm font-medium text-gray-300">{{ user.username if user else 'User' }}</span>
                    <svg class="w-4 h-4 text-gray-500 transition-transform duration-200" id="dropdown-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
 
                <!-- Dropdown Menu -->
                <div id="user-dropdown" class="absolute right-0 top-full mt-2 w-56 glass border border-white/[0.08] rounded-xl shadow-2xl shadow-black/40 py-2 hidden animate-slide-down z-50">
                    <div class="px-4 py-2 border-b border-white/[0.06]">
                        <p id="nav-dropdown-fullname" class="text-sm font-medium text-gray-200">{{ user.full_name if user else 'User Name' }}</p>
                        <p id="nav-dropdown-email" class="text-xs text-gray-500 truncate">{{ user.email if user else 'user@example.com' }}</p>
                    </div>
                    <div class="py-1">
                        <a href="{{ url_for('settings_page') }}" class="flex items-center gap-3 px-4 py-2 text-sm text-gray-300 hover:bg-white/[0.06] hover:text-white transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                            Profile
                        </a>
                        <a href="{{ url_for('settings_page') }}" class="flex items-center gap-3 px-4 py-2 text-sm text-gray-300 hover:bg-white/[0.06] hover:text-white transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            Settings
                        </a>
                    </div>
                    <div class="border-t border-white/[0.06] pt-1">
                        <a href="#" id="nav-logout-btn" class="flex items-center gap-3 px-4 py-2 text-sm text-red-400 hover:bg-red-500/10 hover:text-red-300 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                            Logout
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>
