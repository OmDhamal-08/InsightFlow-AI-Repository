{% extends "base.html" %}

{% block title %}500 — Server Error{% endblock %}

{% block body %}
<div class="relative min-h-screen flex items-center justify-center px-4">
    <!-- Background -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
        <div class="absolute top-1/3 left-1/3 w-[400px] h-[400px] rounded-full bg-red-500/[0.03] blur-[100px]"></div>
        <div class="absolute bottom-1/3 right-1/3 w-[300px] h-[300px] rounded-full bg-orange-500/[0.03] blur-[80px]"></div>
    </div>

    <div class="relative z-10 text-center animate-slide-up">
        <!-- 500 Number -->
        <h1 class="text-[120px] sm:text-[160px] md:text-[200px] font-bold leading-none tracking-tighter">
            <span class="gradient-text bg-gradient-to-r from-red-400 via-orange-400 to-amber-400">500</span>
        </h1>

        <!-- Message -->
        <h2 class="text-xl md:text-2xl font-semibold text-white -mt-4 md:-mt-6">Something Went Wrong</h2>
        <p class="mt-3 text-sm text-gray-400 max-w-md mx-auto">Our servers are having a moment. Please try again later or contact support if the issue persists.</p>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3 mt-8">
            <a href="{{ url_for('home_page') }}" class="w-full sm:w-auto px-6 py-3 text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-primary-600 rounded-xl hover:from-primary-600 hover:to-primary-700 shadow-lg shadow-primary-500/25 transition-all duration-300 hover:-translate-y-0.5">
                Go Home
            </a>
            <button onclick="location.reload()" class="w-full sm:w-auto px-6 py-3 text-sm font-medium text-gray-300 bg-white/[0.05] border border-white/[0.08] rounded-xl hover:bg-white/[0.08] transition-all duration-300">
                Try Again
            </button>
        </div>
    </div>
</div>
{% endblock %}
